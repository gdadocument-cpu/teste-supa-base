<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GDA — test Supabase</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#061426;color:#e9f3ff}
    body{margin:0;padding:40px;min-height:100vh;background:radial-gradient(circle at top,#12365d,#061426 55%)}
    main{max-width:1100px;margin:auto;background:#071c31e8;border:1px solid #24598a;border-radius:18px;padding:28px;box-shadow:0 24px 70px #0008}
    h1{margin-top:0;color:#75bfff}.note{color:#b9cce0}.actions{display:flex;gap:12px;margin:22px 0}
    button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#5865f2;color:white}
    button#logout{background:#263c55}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#03101e;border:1px solid #173c60;border-radius:12px;padding:18px;min-height:180px}
  </style>
</head>
<body>
  <main>
    <h1>Test de migration Supabase</h1>
    <p class="note">Cette page isolée vérifie l’authentification Discord, l’effectif GDA retardé, l’effectif officier instantané et les grades archivés. Elle ne touche pas au site officiel.</p>
    <p id="status">Initialisation…</p>
    <div class="actions">
      <button id="login-discord">Se connecter avec Discord</button>
      <button id="logout" hidden>Se déconnecter</button>
    </div>
    <pre id="results">Aucune donnée affichée tant que la connexion Discord n’est pas active.</pre>
  </main>
  <script src="supabase-config.js"></script>
  <script src="supabase-test.bundle.js"></script>
</body>
</html>
